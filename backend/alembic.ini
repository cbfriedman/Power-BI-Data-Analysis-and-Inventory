# Alembic configuration.
#
# NOTE: sqlalchemy.url is deliberately absent. It is set at runtime in
# alembic/env.py from application settings, so no connection string is ever
# committed to this repository (CLAUDE.md §4).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Migration filenames are prefixed with a UTC timestamp so they sort
# chronologically and merge conflicts are obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# `module` rather than `console_scripts`: ruff ships a standalone binary, not a
# console-script entry point, so alembic cannot resolve it by entrypoint name.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
